<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>BWU Admin — Student Management</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .topbar {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
    }

    .brand p {
      margin: 5px 0 0;
      color: #64748b;
      font-size: 13px;
    }

    .back-btn {
      text-decoration: none;
      color: #ffffff;
      background: #172554;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px 40px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .page-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .page-header p {
      margin: 5px 0 0;
      color: #64748b;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .btn {
      padding: 11px 16px;
      border-radius: 8px;
      font-weight: 600;
    }

    .btn-primary {
      background: #1d4ed8;
      color: white;
    }

    .btn-primary:hover {
      background: #1e40af;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #172033;
    }

    .search-box {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 18px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .search-box input:focus {
      border-color: #2563eb;
    }

    .table-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 14px 16px;
      border-bottom: 1px solid #eef2f7;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f8fafc;
      color: #475569;
      font-weight: 700;
    }

    td {
      color: #334155;
    }

    tr:hover td {
      background: #f8fafc;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-size: 12px;
      font-weight: 700;
    }

    .status.inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .view-btn {
      background: #eff6ff;
      color: #1d4ed8;
      padding: 7px 11px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: #64748b;
    }

    /* Modal */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 20px;
    }

    .close-btn {
      background: #f1f5f9;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 20px;
      color: #334155;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      background: white;
      font-size: 14px;
    }

    .field input:focus,
    .field select:focus {
      border-color: #2563eb;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 11px 13px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .profile-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #eef2f7;
    }

    .profile-row strong {
      color: #475569;
    }

    @media (max-width: 700px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <h1>Brainware University</h1>
      <p>Academic Management System — Student Management</p>
    </div>

    <a class="back-btn" href="admin-dashboard.html">
      ← Admin Dashboard
    </a>
  </header>

  <main class="container">

    <div class="page-header">
      <div>
        <h2>Student Management</h2>
        <p>Create and manage student academic accounts.</p>
      </div>

      <div class="actions">
        <button
          type="button"
          id="resetBtn"
          class="btn btn-secondary"
        >
          Reset
        </button>

        <button
          type="button"
          id="addStudentBtn"
          class="btn btn-primary"
        >
          + Add Student
        </button>
      </div>
    </div>

    <div class="search-box">
      <input
        type="search"
        id="searchInput"
        placeholder="Search by name, email, student ID or department..."
        autocomplete="off"
      />
    </div>

    <section class="table-card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Department</th>
              <th>Semester</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div
        id="emptyState"
        class="empty"
        style="display: none;"
      >
        No students found.
      </div>
    </section>

  </main>

  <!-- ADD STUDENT MODAL -->

  <div
    class="modal"
    id="studentModal"
    aria-hidden="true"
  >
    <div class="modal-box">

      <div class="modal-header">
        <h3>Create Student Account</h3>

        <button
          type="button"
          class="close-btn"
          id="closeStudentModal"
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <form id="studentForm">

        <div class="form-grid">

          <div class="field full">
            <label for="studentName">
              Student Name
            </label>

            <input
              id="studentName"
              type="text"
              required
              maxlength="100"
              placeholder="Enter full name"
            />
          </div>

          <div class="field">
            <label for="studentEmail">
              Email
            </label>

            <input
              id="studentEmail"
              type="email"
              required
              placeholder="student@example.com"
            />
          </div>

          <div class="field">
            <label for="studentPassword">
              Temporary Password
            </label>

            <input
              id="studentPassword"
              type="password"
              required
              minlength="6"
              placeholder="Minimum 6 characters"
            />
          </div>

          <div class="field">
            <label for="studentId">
              Student ID
            </label>

            <input
              id="studentId"
              type="text"
              required
              maxlength="40"
              placeholder="BWU2026001"
            />
          </div>

          <div class="field">
            <label for="studentDepartment">
              Department
            </label>

            <input
              id="studentDepartment"
              type="text"
              required
              maxlength="100"
              placeholder="Computer Science & Engineering"
            />
          </div>

          <div class="field">
            <label for="studentBatch">
              Batch
            </label>

            <input
              id="studentBatch"
              type="text"
              maxlength="30"
              placeholder="2026-2030"
            />
          </div>

          <div class="field">
            <label for="studentSection">
              Section
            </label>

            <input
              id="studentSection"
              type="text"
              maxlength="20"
              placeholder="A"
            />
          </div>

          <div class="field">
            <label for="studentSemester">
              Semester
            </label>

            <select
              id="studentSemester"
              required
            >
              <option value="">Select semester</option>
              <option value="1">Semester 1</option>
              <option value="2">Semester 2</option>
              <option value="3">Semester 3</option>
              <option value="4">Semester 4</option>
              <option value="5">Semester 5</option>
              <option value="6">Semester 6</option>
              <option value="7">Semester 7</option>
              <option value="8">Semester 8</option>
            </select>
          </div>

        </div>

        <div
          id="formMessage"
          class="message"
        ></div>

        <div class="modal-actions">

          <button
            type="button"
            id="cancelStudentBtn"
            class="btn btn-secondary"
          >
            Cancel
          </button>

          <button
            type="submit"
            id="createStudentBtn"
            class="btn btn-primary"
          >
            Create Student
          </button>

        </div>

      </form>

    </div>
  </div>

  <!-- PROFILE MODAL -->

  <div
    class="modal"
    id="profileModal"
    aria-hidden="true"
  >
    <div class="modal-box">

      <div class="modal-header">
        <h3>Student Profile</h3>

        <button
          type="button"
          class="close-btn"
          id="closeProfileModal"
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <div id="profileContent"></div>

    </div>
  </div>

  <!-- FIREBASE + PAGE LOGIC -->

  <script type="module">

      import "/firebase-login.js";

const waitForFirebase = () =>
  new Promise((resolve, reject) => {

    if (window.bwuFirebase) {
      resolve(window.bwuFirebase);
      return;
    }

    const timeout = setTimeout(() => {
      reject(
        new Error(
          "Firebase initialization timed out."
        )
      );
    }, 10000);

    window.addEventListener(
      "bwuFirebaseReady",
      () => {
        clearTimeout(timeout);
        resolve(window.bwuFirebase);
      },
      { once: true }
    );

  });

const {
  auth,
  db,
  createUserWithEmailAndPassword,
  signOut,
  doc,
  setDoc,
  serverTimestamp
} = await waitForFirebase();

    const addStudentBtn =
      document.getElementById("addStudentBtn");

    const studentModal =
      document.getElementById("studentModal");

    const closeStudentModal =
      document.getElementById("closeStudentModal");

    const cancelStudentBtn =
      document.getElementById("cancelStudentBtn");

    const studentForm =
      document.getElementById("studentForm");

    const createStudentBtn =
      document.getElementById("createStudentBtn");

    const formMessage =
      document.getElementById("formMessage");

    const searchInput =
      document.getElementById("searchInput");

    const resetBtn =
      document.getElementById("resetBtn");

    const tbody =
      document.getElementById("tbody");

    const emptyState =
      document.getElementById("emptyState");

    const profileModal =
      document.getElementById("profileModal");

    const closeProfileModal =
      document.getElementById("closeProfileModal");

    const profileContent =
      document.getElementById("profileContent");


    /*
     * Local table data.
     *
     * Newly created students are added here immediately
     * so the admin can see them without refreshing.
     */

    let students = [];


    /*
     * Open Add Student modal
     */

    addStudentBtn.addEventListener(
      "click",
      () => {
        studentForm.reset();

        formMessage.textContent = "";
        formMessage.className = "message";

        studentModal.classList.add("show");
        studentModal.setAttribute(
          "aria-hidden",
          "false"
        );

        document
          .getElementById("studentName")
          .focus();
      }
    );


    /*
     * Close Add Student modal
     */

    function closeStudentModalWindow() {
      studentModal.classList.remove("show");

      studentModal.setAttribute(
        "aria-hidden",
        "true"
      );

      studentForm.reset();

      formMessage.textContent = "";
      formMessage.className = "message";
    }

    closeStudentModal.addEventListener(
      "click",
      closeStudentModalWindow
    );

    cancelStudentBtn.addEventListener(
      "click",
      closeStudentModalWindow
    );


    /*
     * Create Student
     */

    studentForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const name =
          document
            .getElementById("studentName")
            .value
            .trim();

        const email =
          document
            .getElementById("studentEmail")
            .value
            .trim()
            .toLowerCase();

        const password =
          document
            .getElementById("studentPassword")
            .value;

        const studentId =
          document
            .getElementById("studentId")
            .value
            .trim();

        const department =
          document
            .getElementById("studentDepartment")
            .value
            .trim();

        const batch =
          document
            .getElementById("studentBatch")
            .value
            .trim();

        const section =
          document
            .getElementById("studentSection")
            .value
            .trim();

        const semester =
          document
            .getElementById("studentSemester")
            .value;


        if (
          !name ||
          !email ||
          !password ||
          !studentId ||
          !department ||
          !semester
        ) {

          showMessage(
            "Please fill in all required fields.",
            "error"
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "Password must contain at least 6 characters.",
            "error"
          );

          return;
        }


        createStudentBtn.disabled = true;
        createStudentBtn.classList.add("loading");
        createStudentBtn.textContent =
          "Creating...";


        try {

          /*
           * Create Firebase Authentication account.
           */

          const credential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );

          const user =
            credential.user;


          /*
           * Create Firestore academic profile.
           *
           * IMPORTANT:
           * Collection name is "Users" with capital U.
           */

          const studentProfile = {

            uid: user.uid,

            email: email,

            displayName: name,

            role: "STUDENT",

            studentId: studentId,

            department: department,

            batch: batch,

            section: section,

            semester: Number(semester),

            isActive: true,

            createdAt: serverTimestamp(),

            updatedAt: serverTimestamp()

          };


          await setDoc(
            doc(
              db,
              "Users",
              user.uid
            ),
            studentProfile
          );


          /*
           * Sign the newly created student out.
           *
           * This prevents the admin from accidentally
           * becoming logged in as the student.
           */

          await signOut(auth);


          /*
           * Add student to the visible table.
           */

          students.unshift({
            ...studentProfile,
            createdAt: new Date()
          });


          renderStudents();


          showMessage(
            "Student account created successfully. The Firebase Authentication account and Users profile have been created.",
            "success"
          );


          setTimeout(() => {
            closeStudentModalWindow();
          }, 1800);


        } catch (error) {

          console.error(
            "Student creation error:",
            error
          );


          let message =
            "Unable to create student account.";


          if (
            error &&
            typeof error === "object" &&
            "code" in error
          ) {

            switch (error.code) {

              case "auth/email-already-in-use":
                message =
                  "This email already has a Firebase account.";
                break;

              case "auth/invalid-email":
                message =
                  "Please enter a valid email address.";
                break;

              case "auth/weak-password":
                message =
                  "Password must contain at least 6 characters.";
                break;

              case "auth/network-request-failed":
                message =
                  "Network error. Check your internet connection.";
                break;

              case "permission-denied":
                message =
                  "Firestore permission denied. Check Firebase Firestore rules.";
                break;

              default:
                message =
                  error.message ||
                  message;
            }
          }


          showMessage(
            message,
            "error"
          );

        } finally {

          createStudentBtn.disabled = false;

          createStudentBtn.classList.remove(
            "loading"
          );

          createStudentBtn.textContent =
            "Create Student";
        }

      }
    );


    /*
     * Display form messages.
     */

    function showMessage(
      text,
      type
    ) {

      formMessage.textContent = text;

      formMessage.className =
        "message show " +
        type;
    }


    /*
     * Render students.
     */

    function renderStudents(
      filterText = ""
    ) {

      const query =
        filterText
          .trim()
          .toLowerCase();


      const filtered =
        students.filter(
          (student) => {

            const searchable = [

              student.studentId,

              student.displayName,

              student.email,

              student.department,

              student.batch,

              student.section

            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


            return searchable.includes(query);
          }
        );


      tbody.innerHTML = "";


      if (!filtered.length) {

        emptyState.style.display =
          "block";

        return;
      }


      emptyState.style.display =
        "none";


      filtered.forEach(
        (student) => {

          const row =
            document.createElement("tr");


          row.innerHTML = `

            <td>
              ${escapeHtml(student.studentId || "-")}
            </td>

            <td>
              <strong>
                ${escapeHtml(student.displayName || "-")}
              </strong>
            </td>

            <td>
              ${escapeHtml(student.email || "-")}
            </td>

            <td>
              ${escapeHtml(student.department || "-")}
            </td>

            <td>
              ${student.semester || "-"}
            </td>

            <td>
              <span class="status">
                Active
              </span>
            </td>

            <td>
              <button
                type="button"
                class="view-btn"
                data-uid="${escapeHtml(student.uid)}"
              >
                View
              </button>
            </td>

          `;


          row
            .querySelector(".view-btn")
            .addEventListener(
              "click",
              () => {
                showProfile(student);
              }
            );


          tbody.appendChild(row);

        }
      );

    }


    /*
     * Search.
     */

    searchInput.addEventListener(
      "input",
      () => {
        renderStudents(
          searchInput.value
        );
      }
    );


    /*
     * Reset.
     */

    resetBtn.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        renderStudents();

      }
    );


    /*
     * Student profile modal.
     */

    function showProfile(student) {

      profileContent.innerHTML = `

        <div class="profile-row">
          <strong>Name</strong>
          <span>
            ${escapeHtml(student.displayName || "-")}
          </span>
        </div>

        <div class="profile-row">
          <strong>Email</strong>
          <span>
            ${escapeHtml(student.email || "-")}
          </span>
        </div>

        <div class="profile-row">
          <strong>Student ID</strong>
          <span>
            ${escapeHtml(student.studentId || "-")}
          </span>
        </div>

        <div class="profile-row">
          <strong>Department</strong>
          <span>
            ${escapeHtml(student.department || "-")}
          </span>
        </div>

        <div class="profile-row">
          <strong>Batch</strong>
          <span>
            ${escapeHtml(student.batch || "-")}
          </span>
        </div>

        <div class="profile-row">
          <strong>Section</strong>
          <span>
            ${escapeHtml(student.section || "-")}
          </span>
        </div>

        <div class="profile-row">
          <strong>Semester</strong>
          <span>
            ${student.semester || "-"}
          </span>
        </div>

        <div class="profile-row">
          <strong>Role</strong>
          <span>
            ${escapeHtml(student.role || "STUDENT")}
          </span>
        </div>

        <div class="profile-row">
          <strong>Firebase UID</strong>
          <span>
            ${escapeHtml(student.uid || "-")}
          </span>
        </div>

      `;


      profileModal.classList.add(
        "show"
      );

      profileModal.setAttribute(
        "aria-hidden",
        "false"
      );
    }


    closeProfileModal.addEventListener(
      "click",
      () => {

        profileModal.classList.remove(
          "show"
        );

        profileModal.setAttribute(
          "aria-hidden",
          "true"
        );

      }
    );


    /*
     * Close modals when clicking outside.
     */

    studentModal.addEventListener(
      "click",
      (event) => {

        if (
          event.target === studentModal
        ) {
          closeStudentModalWindow();
        }

      }
    );


    profileModal.addEventListener(
      "click",
      (event) => {

        if (
          event.target === profileModal
        ) {

          profileModal.classList.remove(
            "show"
          );

        }

      }
    );


    /*
     * Basic HTML escaping.
     */

    function escapeHtml(value) {

      const div =
        document.createElement("div");

      div.textContent =
        String(value ?? "");

      return div.innerHTML;
    }


    /*
     * Start with an empty student list.
     */

    renderStudents();

  </script>

  <script src="/bwu-config.js"></script>
  <script src="/bwu-addons.js" defer></script>

</body>
</html>
